[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-a3"
version = "0.1.0"
description = "Self-contained multi-motion tracking stack for the AgiBot A3."
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26,<2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14"]
train = [
  "imageio-ffmpeg",
  "mediapy>=1.2.6",
  "mujoco>=3.8.0",
  "mujoco-warp==3.8.0.2",
  "mjviser>=0.0.14",
  "onnxscript>=0.5.4",
  "prettytable",
  "scipy",
  "tensorboard>=2.20.0",
  "tensordict",
  "torch>=2.7.0",
  "torchrunx>=0.3.4",
  "tqdm",
  "trimesh>=4.8.3",
  "tyro>=1.0.1",
  "viser>=1.0.27",
  "wandb>=0.22.3",
  "warp-lang>=1.12.0,<1.15",
]

[project.entry-points."mjlab.tasks"]
mimic_a3 = "mimica3.mjlab"

[project.scripts]
train-mimica3 = "beyondamp.integrations.mjlab.train:main"
play-mimica3 = "mjlab.scripts.play:main"
list-mimica3-envs = "mjlab.scripts.list_envs:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mjlab = ["py.typed", "**/*.xml", "**/*.stl", "**/*.obj", "**/*.urdf"]
mimica3 = [
  "assets/**/*.xml",
  "assets/**/*.stl",
  "assets/**/*.STL",
  "assets/**/*.obj",
  "assets/**/*.json",
  "assets/**/*.npz",
  "assets/**/*.csv",
  "assets/**/LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["B011"]
